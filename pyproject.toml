[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentipulse"
version = "1.0.0"
description = "SentiPulse: Production-Grade Sentiment Classification & Real-Time MLOps Engine"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Santosh Kashyap", email = "santoshkkashyap25@gmail.com"}
]
keywords = [
    "sentiment-analysis",
    "mlops",
    "roberta",
    "onnx",
    "quantization",
    "fastapi",
    "data-drift",
    "customer-feedback",
    "nlp"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "nltk>=3.8.0",
    "tokenizers>=0.14.0",
    "onnxruntime>=1.16.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "xgboost>=1.7.0",
    "imblearn>=0.0",
    "kaggle>=1.5.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "onnx>=1.14.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/santoshkkashyap25/sentiment-analysis"
Documentation = "https://github.com/santoshkkashyap25/sentiment-analysis#readme"
Repository = "https://github.com/santoshkkashyap25/sentiment-analysis.git"
Issues = "https://github.com/santoshkkashyap25/sentiment-analysis/issues"
"Live Demo" = "https://sentipulse.onrender.com"

[project.scripts]
sentipulse = "sentipulse.cli:main"
run-pipeline = "pipeline:main"

[tool.setuptools.packages.find]
include = ["src*", "sentipulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "logs", "dist", "build"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests", "pipeline.py"]
extraPaths = ["."]
executionEnvironments = [
    { root = "." }
]
venvPath = "."
venv = ".venv"
