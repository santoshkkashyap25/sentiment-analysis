[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentipulse"
version = "1.0.0"
description = "SentiPulse: Production-Grade Sentiment Classification & Real-Time MLOps Engine"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "kaggle",
    "pandas",
    "scikit-learn",
    "nltk",
    "imblearn",
    "sentence-transformers",
    "textblob",
    "xgboost",
    "fastapi",
    "uvicorn",
    "matplotlib",
    "seaborn",
    "python-dotenv",
    "tqdm",
    "joblib",
    "requests",
    "onnx",
    "tokenizers",
    "onnxruntime",
    "transformers",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
sentipulse = "sentipulse.cli:main"
run-pipeline = "pipeline:main"

[tool.setuptools.packages.find]
include = ["src*", "sentipulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "data", "logs", "dist", "build"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
pythonpath = ["."]

[tool.pyright]
include = ["src", "tests", "pipeline.py"]
extraPaths = ["."]
executionEnvironments = [
    { root = "." }
]
venvPath = "."
venv = ".venv"

