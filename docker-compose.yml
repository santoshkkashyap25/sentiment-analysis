version: '3.8'

services:
  sentipulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentipulse-engine
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
      - SENTIPULSE_ESCALATION_THRESHOLD=0.85
      # Optional: Set outgoing webhook for automated escalation notifications
      # - SENTIPULSE_WEBHOOK_URL=https://hooks.slack.com/services/...
    volumes:
      - sentipulse-data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  sentipulse-data:
    driver: local

