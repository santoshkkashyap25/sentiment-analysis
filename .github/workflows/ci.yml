name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Download NLTK corpora
        run: |
          python -c "import nltk; nltk.download('punkt', quiet=True); nltk.download('punkt_tab', quiet=True); nltk.download('stopwords', quiet=True); nltk.download('wordnet', quiet=True)"
          python -c "import os, zipfile, glob; zips = glob.glob(os.path.expanduser('~/nltk_data/corpora/*.zip')); [zipfile.ZipFile(z).extractall(os.path.dirname(z)) for z in zips]"

      - name: Run PyTest suite with coverage
        id: pytest_step
        run: |
          set -o pipefail
          python -m pytest tests/ -v --cov=src --cov-report=term-missing 2>&1 | tee pytest_output.log
        continue-on-error: true

      - name: Output PyTest failure details
        if: steps.pytest_step.outcome != 'success'
        run: |
          echo "## ❌ PyTest Execution Failures" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 pytest_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "FAILED|ERROR" pytest_output.log | head -n 20 | while read -r line; do
            echo "::error::$line"
          done
          exit 1
